[project]
name = "pynotebook"
version = "0.1.0"
description = "Minimal terminal-based NotebookLM-style app"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "pynotebook" }
]
dependencies = [
    "textual",
    "httpx",
    "aiosqlite",
    "pypdf",
    "python-docx",
    "beautifulsoup4",
    "lxml",
    "tomli-w",
]

[project.scripts]
pynotebook = "pynotebook.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pynotebook"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
