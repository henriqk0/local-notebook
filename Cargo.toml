[package]
name = "rsnotebook"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal NotebookLM-style app: chat with your local files using OpenRouter, Anthropic, your Claude plan, or any OpenAI-compatible endpoint"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
glob = "0.3.4"
pdf-extract = "0.12.1"
pulldown-cmark = { version = "0.13.5", default-features = false }
quick-xml = "0.42.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
tokio-util = "0.7.20"
toml = "1.1.8"
unicode-width = "0.2.2"
zip = "9.0.5"
